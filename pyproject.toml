[project]
name = "camel-goodmem"
description = "GoodMem integration for CAMEL."
authors = [{ name = "PAIR Systems" }]
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.0"
license-files = ["LICENSE"]
urls.homepage = "https://github.com/PAIR-Systems-Inc/goodmem_camel"
urls.source = "https://github.com/PAIR-Systems-Inc/goodmem_camel"
urls.issues = "https://github.com/PAIR-Systems-Inc/goodmem_camel/issues"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "camel-ai>=0.2.0",
    "goodmem>=0.1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "httpx",
    "ruff==0.7.4",
    "mypy",
    "build",
    "twine",
]
examples = [
    "openai>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = "-ra -q -r fEX"
timeout = 120
markers = [
    "integration: marks tests as integration tests that require external services",
]

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "B", "C4", "RUF", "E"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
