[project]
name = "camel-goodmem"
description = "GoodMem integration for CAMEL."
authors = [{ name = "PAIR Systems" }]
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.1"
license-files = ["LICENSE"]
urls.homepage = "https://github.com/PAIR-Systems-Inc/goodmem_camel"
urls.source = "https://github.com/PAIR-Systems-Inc/goodmem_camel"
urls.issues = "https://github.com/PAIR-Systems-Inc/goodmem_camel/issues"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    # Measured on Python 3.10: camel-ai 0.2.0 and 0.2.10 lack camel.logger;
    # 0.2.20 and 0.2.59 fail importing their own undeclared dependency
    # (PIL); 0.2.60-0.2.78 (measured: 0.2.60, 0.2.70, 0.2.72-0.2.78) import,
    # but their BaseToolkit timeout wrapper turns every exception a method
    # raises -- GoodMemIdError, GoodMemError -- into IndexError. 0.2.79
    # re-raises it. CI's `floors` job installs these floors and tests them.
    "camel-ai>=0.2.79",
    "goodmem>=0.1.35",
    # camel-ai's BaseToolkit does `from mcp.server import FastMCP`, which mcp
    # 2.x moved. camel-ai only requires `mcp>=1.3.0`, so a fresh install
    # resolves mcp 2.x and the package cannot be imported at all -- which is
    # what `pip install camel-goodmem==0.1.0` does today. Pinned until
    # camel-ai supports mcp 2.x.
    "mcp<2",
    # Declares id parameters as UUIDs in the tool schema the model sees.
    # Already required by both camel-ai and goodmem; listed because it is
    # imported directly. On Python 3.10, pydantic 2.10 makes camel-ai's
    # FunctionTool raise "issubclass() arg 1 must be a class" for a method
    # annotated to return a parametrised dict, so get_tools() fails; 2.11
    # does not.
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "httpx",
    "ruff==0.7.4",
    "mypy",
    "build",
    "twine",
]
examples = [
    "openai>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = "-ra -q -r fEX"
timeout = 120
markers = [
    "integration: marks tests as integration tests that require external services",
]

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "B", "C4", "RUF", "E"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
