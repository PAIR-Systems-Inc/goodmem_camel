# Tests, lint and the gates. The publish workflow can ship a release without
# any of this having run, which is how 0.1.0 shipped with 71 green tests that
# mocked the HTTP session wholesale -- so this runs on every push and PR.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          set -euo pipefail
          ruff check camel_goodmem tests
          ruff format --check camel_goodmem tests

      - name: Types
        run: mypy camel_goodmem

      - name: Offline suite
        run: pytest tests/test_goodmem_toolkit.py tests/test_goodmem_ids.py -v

      - name: Live tests must skip without credentials
        env:
          GOODMEM_API_KEY: ""
          GOODMEM_BASE_URL: ""
        run: |
          set -euo pipefail
          pytest tests/test_goodmem_live.py -v > live.log 2>&1
          grep -q "skipped" live.log
          if grep -qE "^tests.*(PASSED|FAILED)" live.log; then
            echo "A live test ran without credentials -- a key may be baked in."
            exit 1
          fi

      - name: Package builds and imports in a clean environment
        run: |
          set -euo pipefail
          pip install build
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/python -c "import camel_goodmem; print(camel_goodmem.__version__)"

  # The declared lower bounds, installed as-is. `--resolution lowest-direct`
  # takes the floor of every direct dependency (camel-ai, goodmem, pydantic,
  # and mcp at the lowest camel-ai accepts), then the package is imported and
  # the offline suite run against them. camel-ai 0.2.0-0.2.59 cannot import
  # this package; 0.2.60-0.2.78 import it but turn every exception a toolkit
  # method raises into IndexError; pydantic 2.10 breaks every tool on 3.10.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the declared floors
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          uv venv /tmp/floor --python "$(command -v python)"
          uv pip install --python /tmp/floor/bin/python \
            --resolution lowest-direct -e .
          uv pip install --python /tmp/floor/bin/python pytest pytest-timeout

      - name: The installed versions are the declared floors
        run: |
          set -euo pipefail
          /tmp/floor/bin/python - <<'PY'
          import re
          from importlib.metadata import version

          text = open("pyproject.toml").read()
          block = text.split("dependencies = [", 1)[1]
          code = [ln for ln in block.splitlines() if not ln.strip().startswith("#")]
          deps = "\n".join(code).split("]", 1)[0]
          floors = dict(re.findall(r'"([A-Za-z0-9_.-]+)>=([0-9][^",<]*)', deps))
          assert {"camel-ai", "goodmem", "pydantic"} <= set(floors), floors


          def padded(v):
              parts = [int(x) for x in v.split(".")]
              return parts + [0] * (3 - len(parts))

          wrong = {}
          for name, floor in sorted(floors.items()):
              got = version(name)
              print(f"{name}: declared >={floor}, installed {got}")
              if padded(got) != padded(floor):
                  wrong[name] = got
          assert not wrong, f"not at the declared floor: {wrong}"
          major = int(version("mcp").split(".")[0])
          print(f"mcp: declared <2, installed {version('mcp')}")
          assert major < 2
          PY

      - name: Package imports at the floors
        run: |
          set -euo pipefail
          /tmp/floor/bin/python -c "import camel_goodmem; print(camel_goodmem.__version__)"

      - name: Offline suite at the floors
        run: |
          set -euo pipefail
          /tmp/floor/bin/python -m pytest \
            tests/test_goodmem_toolkit.py tests/test_goodmem_ids.py -v

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No GoodMem API key in any tracked file
        run: |
          set -euo pipefail
          if git ls-files -z | xargs -0 grep -IEn "gm_[a-z0-9]{20,}" ; then
            echo "A GoodMem API key is committed to this repository."
            exit 1
          fi
          echo "No credential-shaped string in any tracked file."

      - name: TLS verification is not disabled in shipped Python
        run: |
          set -euo pipefail
          if find camel_goodmem -name '*.py' \
               -exec grep -In "verify_ssl=False" {} + ; then
            echo "TLS verification is disabled in shipped Python."
            exit 1
          fi
          echo "No disabled TLS in shipped Python."

# publicRead is checked by tests/test_goodmem_toolkit.py, which strips
# docstrings via ast before looking -- a grep cannot tell a field being sent
# from a sentence explaining why it no longer is.
